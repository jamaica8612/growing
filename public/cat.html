<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>내친구 깜냥이 ✨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;user-select:none;touch-action:none;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:10;}
#sr{display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:bold;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.6);}
.meter{height:15px;border-radius:10px;background:rgba(255,255,255,0.18);overflow:hidden;position:relative;}
.mf{height:100%;border-radius:10px;transition:width .4s;}
.ml{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.6);white-space:nowrap;}
#mr{display:flex;gap:8px;}
#mr .meter{flex:1;}
#speech{position:fixed;top:17%;left:50%;transform:translateX(-50%) scale(.85);background:rgba(255,255,255,.95);border-radius:20px;padding:13px 22px;font-size:21px;font-weight:bold;color:#e0306a;max-width:78vw;text-align:center;white-space:pre-line;line-height:1.4;box-shadow:0 8px 28px rgba(0,0,0,.22);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30;}
#speech.show{opacity:1;transform:translateX(-50%) scale(1);}
#speech::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);border:12px solid transparent;border-top-color:rgba(255,255,255,.95);border-bottom:0;}
#actions{position:fixed;bottom:0;left:0;right:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:rgba(0,0,0,.4);backdrop-filter:blur(12px);z-index:10;}
.btn{border:none;background:rgba(255,255,255,.1);border-radius:14px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .1s,background .1s;border:1px solid rgba(255,255,255,.14);}
.btn:active{transform:scale(.88);background:rgba(255,255,255,.22);}
.btn .ico{font-size:28px;line-height:1;}
.btn .lbl{font-size:11px;font-weight:bold;color:rgba(255,255,255,.88);}
#celeb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;}
#celeb.active{animation:ca 2.8s ease-out forwards;}
@keyframes ca{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
#celeb .box{background:rgba(220,50,120,.92);color:#fff;padding:26px 38px;border-radius:26px;font-size:30px;font-weight:bold;text-align:center;line-height:1.5;white-space:pre-line;box-shadow:0 14px 50px rgba(220,50,120,.5);}
.cp{position:fixed;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:110;animation:cf var(--cd) ease-in forwards;}
@keyframes cf{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(540deg) translateX(var(--cx));opacity:0}}
#home{position:fixed;top:10px;left:10px;z-index:60;background:rgba(255,255,255,.14);border:none;border-radius:50%;width:42px;height:42px;font-size:21px;cursor:pointer;color:#fff;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;text-decoration:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div id="sr"><span id="sn">🐾 아기 깜냥이</span><span id="bt">💕0</span></div>
<div class="meter"><div id="gf" class="mf" style="background:linear-gradient(90deg,#ffd24d,#ff9d4d);width:0%"></div><div class="ml" id="gl">다음까지 💕40</div></div>
<div id="mr">
<div class="meter"><div id="ff" class="mf" style="background:linear-gradient(90deg,#ffb347,#ff8c42);width:80%"></div><div class="ml">🍚 배부름</div></div>
<div class="meter"><div id="hf" class="mf" style="background:linear-gradient(90deg,#ff9ec7,#ff6b9d);width:80%"></div><div class="ml">💛 행복</div></div>
</div>
</div>
<div id="speech"></div>
<div id="actions">
<button class="btn" data-act="feed"><span class="ico">🍚</span><span class="lbl">밥주기</span></button>
<button class="btn" data-act="treat"><span class="ico">🐟</span><span class="lbl">간식</span></button>
<button class="btn" data-act="play"><span class="ico">🧶</span><span class="lbl">놀기</span></button>
<button class="btn" data-act="wash"><span class="ico">🫧</span><span class="lbl">씻기</span></button>
<button class="btn" data-act="brush"><span class="ico">✨</span><span class="lbl">빗질</span></button>
<button class="btn" data-act="sleep"><span class="ico">😴</span><span class="lbl">재우기</span></button>
</div>
<div id="celeb"><div class="box" id="ct"></div></div>
<a id="home" href="./play.html">🏠</a>
<script>
(function(){
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,CX,CY;
function resize(){const pr=devicePixelRatio||1;cv.width=window.innerWidth*pr;cv.height=window.innerHeight*pr;cv.style.width=window.innerWidth+'px';cv.style.height=window.innerHeight+'px';cx.setTransform(pr,0,0,pr,0,0);W=window.innerWidth;H=window.innerHeight;CX=W/2;CY=H/2;}
window.addEventListener('resize',resize);resize();

const STAGES=[
{name:'🐾 아기 깜냥이',min:0,sc:0.52},
{name:'🌱 꼬마 깜냥이',min:40,sc:0.68},
{name:'⭐ 청소년 깜냥이',min:120,sc:0.86},
{name:'👑 어른 깜냥이',min:280,sc:1.04},
];
let state={full:80,happy:80,bond:0,sleeping:false};
try{const s=JSON.parse(localStorage.getItem('kk3')||'{}');if(s.bond)state.bond=s.bond;}catch(e){}
function stageOf(b){let i=0;STAGES.forEach((s,idx)=>{if(b>=s.min)i=idx;});return i;}
let si=stageOf(state.bond);
function save(){try{localStorage.setItem('kk3',JSON.stringify({bond:state.bond}));}catch(e){}}

// Audio
let ac=null;
function gac(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function meow(){try{const c=gac(),o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';f.type='bandpass';f.frequency.value=1100;f.Q.value=6;o.connect(f);f.connect(g);g.connect(c.destination);const t=c.currentTime;o.frequency.setValueAtTime(620,t);o.frequency.linearRampToValueAtTime(900,t+.12);o.frequency.linearRampToValueAtTime(500,t+.34);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.start(t);o.stop(t+.42);}catch(e){}}
function purr(){try{const c=gac(),o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();o.type='sawtooth';o.frequency.value=42;lp.type='lowpass';lp.frequency.value=200;o.connect(lp);lp.connect(g);g.connect(c.destination);const t=c.currentTime;g.gain.setValueAtTime(.12,t);g.gain.setValueAtTime(.12,t+.7);g.gain.exponentialRampToValueAtTime(.001,t+.95);o.start(t);o.stop(t+.96);}catch(e){}}
function chime(ns){try{const c=gac();ns.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.connect(g);g.connect(c.destination);const t=c.currentTime+i*.11;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.33);});}catch(e){}}

// Particles
const pts=[];
class P{
constructor(x,y,o={}){this.x=x;this.y=y;this.vx=(Math.random()-.5)*(o.spd||4);this.vy=-Math.random()*(o.spd||4)-1;this.life=1;this.dec=.018+Math.random()*.02;this.sz=(o.sz||9)+Math.random()*6;this.col=o.col||`hsl(${Math.random()*360},88%,65%)`;this.type=o.type||'circle';this.txt=o.txt||'✨';this.grav=o.grav!==undefined?o.grav:.1;this.rot=Math.random()*Math.PI*2;this.rv=(Math.random()-.5)*.2;}
update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.grav;this.life-=this.dec;this.rot+=this.rv;return this.life>0;}
draw(c){c.save();c.globalAlpha=Math.max(0,this.life);c.translate(this.x,this.y);c.rotate(this.rot);if(this.type==='text'){c.font=`${this.sz}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(this.txt,0,0);}else if(this.type==='rect'){c.fillStyle=this.col;c.fillRect(-this.sz/2,-this.sz/2,this.sz,this.sz);}else{c.beginPath();c.arc(0,0,this.sz/2,0,Math.PI*2);c.fillStyle=this.col;c.fill();}c.restore();}
}
function burst(x,y,n,o){for(let i=0;i<n;i++)pts.push(new P(x,y,o));}

// Anim state
const an={br:0,tail:0,eL:0,eR:0,blT:0,blD:0,nxB:0,eo:1,jy:0,jvy:0,jump:false,sx:1,sy:1,mood:'normal'};
function jump(){if(an.jump)return;an.jump=true;an.jvy=-.45;an.sx=.85;an.sy=1.2;}

// Draw cat on canvas
function drawCat(ox,oy,sc){
cx.save();
cx.translate(ox,oy+an.jy);
cx.scale(sc*an.sx,sc*an.sy);
const br=Math.sin(an.br*Math.PI*2)*.012;
// shadow
cx.beginPath();cx.ellipse(0,148,70*(1+br*2),12,0,0,Math.PI*2);cx.fillStyle='rgba(0,0,0,.18)';cx.fill();
// tail
cx.save();cx.translate(52,90);cx.rotate(an.tail);
cx.beginPath();cx.moveTo(0,0);cx.bezierCurveTo(80,-20,90,-80,40,-120);cx.bezierCurveTo(20,-140,-10,-130,0,-110);cx.bezierCurveTo(30,-105,50,-80,20,-40);cx.bezierCurveTo(10,-20,5,-10,0,0);
const tg=cx.createLinearGradient(0,0,40,-120);tg.addColorStop(0,'#2a2a38');tg.addColorStop(1,'#3e3e52');cx.fillStyle=tg;cx.fill();cx.restore();
// body
cx.save();cx.scale(1+br,1-br*.5);
const bg=cx.createRadialGradient(-20,20,10,0,40,90);bg.addColorStop(0,'#4a4a60');bg.addColorStop(1,'#1e1e2e');
cx.beginPath();cx.ellipse(0,60,68,82,0,0,Math.PI*2);cx.fillStyle=bg;cx.fill();
const blg=cx.createRadialGradient(0,80,5,0,80,48);blg.addColorStop(0,'#5a5a72');blg.addColorStop(1,'rgba(60,60,80,0)');
cx.beginPath();cx.ellipse(0,80,38,46,0,0,Math.PI*2);cx.fillStyle=blg;cx.fill();cx.restore();
// paws
[[-30,140],[30,140]].forEach(([px,py])=>{
cx.beginPath();cx.ellipse(px,py,20,13,0,0,Math.PI*2);cx.fillStyle='#2a2a38';cx.fill();
cx.strokeStyle='#1a1a28';cx.lineWidth=1.5;
[-6,0,6].forEach(dx=>{cx.beginPath();cx.moveTo(px+dx,py+6);cx.lineTo(px+dx,py+12);cx.stroke();});
});
// head group
cx.save();cx.translate(0,-40);
// ear L
cx.save();cx.translate(-46,-50);cx.rotate(-.15+an.eL*.3);
cx.beginPath();cx.moveTo(0,0);cx.lineTo(-22,-48);cx.lineTo(26,-32);cx.closePath();cx.fillStyle='#2a2a38';cx.fill();
cx.beginPath();cx.moveTo(2,-3);cx.lineTo(-12,-34);cx.lineTo(16,-22);cx.closePath();cx.fillStyle='#f3a0b5';cx.fill();cx.restore();
// ear R
cx.save();cx.translate(46,-50);cx.rotate(.15-an.eR*.3);
cx.beginPath();cx.moveTo(0,0);cx.lineTo(22,-48);cx.lineTo(-26,-32);cx.closePath();cx.fillStyle='#2a2a38';cx.fill();
cx.beginPath();cx.moveTo(-2,-3);cx.lineTo(12,-34);cx.lineTo(-16,-22);cx.closePath();cx.fillStyle='#f3a0b5';cx.fill();cx.restore();
// head
const hg=cx.createRadialGradient(-15,-20,5,0,0,62);hg.addColorStop(0,'#4a4a60');hg.addColorStop(1,'#1e1e2e');
cx.beginPath();cx.arc(0,0,60,0,Math.PI*2);cx.fillStyle=hg;cx.fill();
// blush
cx.globalAlpha=.42;
[[-38,18],[38,18]].forEach(([bx,by])=>{
const gg=cx.createRadialGradient(bx,by,0,bx,by,16);gg.addColorStop(0,'#ff9ec7');gg.addColorStop(1,'transparent');
cx.beginPath();cx.arc(bx,by,16,0,Math.PI*2);cx.fillStyle=gg;cx.fill();
});cx.globalAlpha=1;
// eyes
const eo=an.eo,mood=an.mood;
[[-22,-8],[22,-8]].forEach(([ex,ey])=>{
if(mood==='sleep'||eo<.15){
cx.beginPath();cx.moveTo(ex-14,ey);cx.quadraticCurveTo(ex,ey+10,ex+14,ey);cx.strokeStyle='#d0c0e8';cx.lineWidth=3.5;cx.lineCap='round';cx.stroke();
}else if(mood==='happy'){
cx.beginPath();cx.moveTo(ex-14,ey+4);cx.quadraticCurveTo(ex,ey-14,ex+14,ey+4);cx.strokeStyle='#d0c0e8';cx.lineWidth=3.5;cx.lineCap='round';cx.stroke();
}else{
const eh=20*eo;
cx.beginPath();cx.ellipse(ex,ey,14,eh,0,0,Math.PI*2);cx.fillStyle='#f0ece8';cx.fill();
cx.beginPath();cx.ellipse(ex,ey+1,10,Math.max(1,eh*.8),0,0,Math.PI*2);cx.fillStyle='#7dc47a';cx.fill();
cx.beginPath();cx.ellipse(ex,ey+1,6,Math.max(1,eh*.6),0,0,Math.PI*2);cx.fillStyle='#1a1020';cx.fill();
if(eo>.5){
cx.beginPath();cx.arc(ex-4,ey-3,3.5,0,Math.PI*2);cx.fillStyle='#fff';cx.fill();
cx.beginPath();cx.arc(ex+4,ey+2,2,0,Math.PI*2);cx.fillStyle='rgba(255,255,255,.6)';cx.fill();
}
}
});
// nose
cx.beginPath();cx.moveTo(-6,14);cx.lineTo(6,14);cx.lineTo(0,20);cx.closePath();cx.fillStyle='#ff7fa3';cx.fill();
// mouth
if(mood==='eat'){
const mo=.5+.5*Math.sin(Date.now()*.015);
cx.beginPath();cx.ellipse(0,28+mo*4,14,8+mo*6,0,0,Math.PI*2);cx.fillStyle='#d03060';cx.fill();
cx.beginPath();cx.ellipse(0,27+mo*4,10,4+mo*3,0,0,Math.PI*2);cx.fillStyle='#ff9ec7';cx.fill();
}else if(mood==='happy'){
cx.beginPath();cx.moveTo(-12,24);cx.quadraticCurveTo(0,38,12,24);cx.strokeStyle='#d0c0e8';cx.lineWidth=3.5;cx.lineCap='round';cx.stroke();
}else{
cx.beginPath();cx.moveTo(0,20);cx.lineTo(0,26);cx.strokeStyle='#d0c0e8';cx.lineWidth=3;cx.lineCap='round';cx.stroke();
cx.beginPath();cx.moveTo(-12,26);cx.quadraticCurveTo(-6,34,0,26);cx.quadraticCurveTo(6,34,12,26);cx.strokeStyle='#d0c0e8';cx.lineWidth=3;cx.lineCap='round';cx.stroke();
}
// whiskers
cx.strokeStyle='rgba(200,190,220,.65)';cx.lineWidth=1.8;cx.lineCap='round';
[[-18,12,-60,5],[-18,20,-62,22],[18,12,60,5],[18,20,62,22]].forEach(([x1,y1,x2,y2])=>{
cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();
});
cx.restore();cx.restore();
}

// Background
const stars=Array.from({length:65},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,tw:Math.random()*Math.PI*2}));
let nightMode=false;
function drawBg(t){
const g=cx.createLinearGradient(0,0,0,H);
if(nightMode){
g.addColorStop(0,'#1a1a3e');g.addColorStop(.5,'#2a2a5e');g.addColorStop(1,'#3a3a7e');
}else{
g.addColorStop(0,'#87CEEB');g.addColorStop(.5,'#b8e4f7');g.addColorStop(1,'#e8f7ff');
}
cx.fillStyle=g;cx.fillRect(0,0,W,H);
if(nightMode){
stars.forEach(s=>{
s.tw+=.018;
const a=.35+.65*Math.sin(s.tw);
cx.beginPath();cx.arc(s.x*W,s.y*H*.72,s.r,0,Math.PI*2);cx.fillStyle=`rgba(255,255,220,${a})`;cx.fill();
});
}else{
// clouds
cx.fillStyle='rgba(255,255,255,.55)';
[[.14,.1,55],[.62,.07,40],[.4,.16,48]].forEach(([fx,fy,r])=>{
const x=fx*W,y=fy*H;
cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.arc(x+r*.8,y-r*.3,r*.75,0,Math.PI*2);cx.arc(x-r*.7,y-r*.22,r*.65,0,Math.PI*2);cx.arc(x+r*1.4,y+r*.1,r*.55,0,Math.PI*2);cx.fill();
});
}
// ground
const fg=cx.createLinearGradient(0,H*.72,0,H);
if(nightMode){fg.addColorStop(0,'rgba(40,40,80,0)');fg.addColorStop(.3,'rgba(40,40,80,.5)');fg.addColorStop(1,'#2a2a5a');}
else{fg.addColorStop(0,'rgba(139,200,130,0)');fg.addColorStop(.3,'rgba(139,200,130,.35)');fg.addColorStop(1,'#7dc47a');}
cx.fillStyle=fg;cx.fillRect(0,H*.72,W,H*.28);
// zzz
if(state.sleeping){
const za=.6+.4*Math.sin(t*.003);
['z','z','z'].forEach((z,i)=>{
cx.font=`bold ${26-i*4}px serif`;cx.fillStyle=`rgba(200,200,255,${za*(1-i*.25)})`;cx.fillText(z,CX+68+i*16,H*.35-i*22);
});
}
}

// Play mode
let playMode=false,toyX=CX,toyY=H*.4,playEnd=0;

// Main loop
let lt=0;
function loop(t){
const dt=Math.min(t-lt,50);lt=t;
cx.clearRect(0,0,W,H);
drawBg(t);
an.br+=dt*.00028;
an.tail=.15+Math.sin(t*.0018)*.2;
an.eL+=(-an.eL)*.08;an.eR+=(-an.eR)*.08;
// blink
if(t>an.nxB){an.blT=t;an.blD=110;an.nxB=t+2500+Math.random()*3500;}
if(an.blD>0){const bl=(t-an.blT)/an.blD;an.eo=bl<.5?1-bl*2:(bl-.5)*2;if(bl>=1)an.blD=0;}else an.eo=1;
// jump physics
if(an.jump){an.jy+=an.jvy*dt;an.jvy+=.008*dt;if(an.jy>=0){an.jy=0;an.jump=false;an.jvy=0;an.sx=1.18;an.sy=.82;}}
an.sx+=(1-an.sx)*.14;an.sy+=(1-an.sy)*.14;
// toy
if(playMode){
if(t>playEnd){playMode=false;endPlay();}
cx.font='42px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🧶',toyX,toyY);
const gy=H*.72;const dist=Math.hypot(toyX-CX,toyY-(gy-50*STAGES[si].sc));
if(dist<90&&Math.random()<.05){jump();burst(toyX,toyY,2,{type:'text',txt:'✨',sz:18,spd:3});}
}
// draw cat
drawCat(CX,H*.72-50,STAGES[si].sc);
// particles
for(let i=pts.length-1;i>=0;i--){if(!pts[i].update()){pts.splice(i,1);continue;}pts[i].draw(cx);}
requestAnimationFrame(loop);
}

// Interaction helpers
let lastPet=0,petCnt=0;
function pet(x,y){
const now=Date.now();if(now-lastPet<80)return;lastPet=now;petCnt++;
if(petCnt%5===0)purr();
if(petCnt%3===0){burst(x,y,3,{type:'text',txt:'💕',sz:20,spd:2.5,grav:.05});state.happy=Math.min(100,state.happy+1);addBond(.5);}
if(petCnt%12===0){say(pick(['그르랉~ 좋아 💕','연아 손 따뜻해','더 쓰다듬어줘~','기분 최고야']));an.mood='happy';setTimeout(()=>an.mood='normal',2000);}
}
function moveToy(x,y){toyX+=(x-toyX)*.18;toyY+=(y-toyY)*.18;}
function isOnCat(x,y){const gy=H*.72,sc=STAGES[si].sc,r=75*sc;return Math.hypot(x-CX,y-(gy-100*sc))<r;}
function endPlay(){an.mood='normal';say('재밌었어 연아야! 😻');burst(CX,H*.5,12,{type:'text',txt:'⭐',sz:22,spd:4});addBond(2);refreshUI();}

const pick=a=>a[Math.floor(Math.random()*a.length)];
const LINES={
feed:['냠냠 맛있다!','잘 먹었어 연아야 😋','배불러~ 고마워'],
treat:['우와 생선이다! 🐟','연아 최고야!','맛있어 그르랉~'],
play:['신난다! 같이 놀자','잡았다! 😸','데굴데굴~','더 더!'],
wash:['뽀득뽀득 깨끗해졌다','거품 보글보글~ 🫧','향기나지? 헤헤'],
brush:['반짝반짝 털 됐다 ✨','간질간질 좋아','이뻐졌지 연아야?'],
sleep:['연아야 잘자... 쿨쿨','같이 잤까? Zzz','...zzz 쿨쿨'],
greet:['연아야 안녕! 😺','연아 왔구나! 반가워','야옹~ 연아!'],
idle:['연아 사랑해 💕','...낙잠이 최고','연아야 뮤해?','배고파~ 밥 줘'],
};

let sleepOn=false,moodT=null;
function setMood(m,d){an.mood=m;clearTimeout(moodT);if(d)moodT=setTimeout(()=>an.mood='normal',d);}
function wake(){if(!sleepOn)return;sleepOn=false;nightMode=false;setMood('normal');state.sleeping=false;}

const actions={
feed(){wake();state.full=Math.min(100,state.full+28);setMood('eat',2000);say(pick(LINES.feed));meow();burst(CX,H*.55,8,{type:'text',txt:'🍚',sz:20,spd:3,grav:.12});addBond(2);refreshUI();},
treat(){wake();state.full=Math.min(100,state.full+12);state.happy=Math.min(100,state.happy+15);setMood('happy',2200);say(pick(LINES.treat));meow();jump();burst(CX,H*.45,15,{type:'text',txt:'🐟',sz:22,spd:4,grav:.08});burst(CX,H*.5,8,{type:'text',txt:'⭐',sz:18,spd:3});addBond(4);refreshUI();},
play(){wake();if(!playMode){playMode=true;toyX=CX+(Math.random()-.5)*W*.4;toyY=H*.35;playEnd=Date.now()+9000;setMood('play');meow();jump();say(pick(LINES.play));addBond(3);state.happy=Math.min(100,state.happy+15);}},
wash(){wake();state.happy=Math.min(100,state.happy+12);setMood('happy',2000);say(pick(LINES.wash));burst(CX,H*.5,18,{type:'circle',col:'rgba(180,230,255,.8)',sz:14,spd:3.5,grav:-.03});chime([784,880,988]);addBond(3);refreshUI();},
brush(){wake();state.happy=Math.min(100,state.happy+12);setMood('happy',2000);say(pick(LINES.brush));purr();burst(CX,H*.45,14,{type:'text',txt:'✨',sz:20,spd:3.5});addBond(3);refreshUI();},
sleep(){if(!sleepOn){sleepOn=true;nightMode=true;setMood('sleep');state.sleeping=true;say(pick(LINES.sleep),3200);chime([523,440,392]);state.happy=Math.min(100,state.happy+10);addBond(2);refreshUI();}else{wake();say('잘 잤다! 개운해 😺');}},
};

document.querySelectorAll('.btn').forEach(b=>{b.addEventListener('click',()=>{if(ac&&ac.state==='suspended')ac.resume();actions[b.dataset.act]();});});

function addBond(n){
state.bond+=n;save();
const ns=stageOf(state.bond);
if(ns>si){si=ns;refreshUI();setTimeout(growCeleb,300);}else refreshUI();
}
function growCeleb(){
const st=STAGES[si];
document.getElementById('ct').textContent=`깜냥이가 자랐어요! 🎉\n${st.name}\n연아 덕분이야 💕`;
const el=document.getElementById('celeb');el.classList.remove('active');void el.offsetWidth;el.classList.add('active');
chime([523,659,784,1047,1319,1047,1319]);jump();jump();
burst(CX,H*.4,30,{type:'rect',sz:12,spd:6,grav:.12});burst(CX,H*.4,20,{type:'text',txt:'🎉',sz:24,spd:5});
const cols=['#ff6b9d','#ffd24d','#8fd178','#7bc6ff','#c89bff','#ff9d4d'];
for(let i=0;i<40;i++){const c=document.createElement('div');c.className='cp';
c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
c.style.setProperty('--cd',(1.5+Math.random()*1.2).toFixed(2)+'s');
c.style.setProperty('--cx',((Math.random()-.5)*160).toFixed(0)+'px');
c.style.animationDelay=(Math.random()*.4)+'s';
document.body.appendChild(c);setTimeout(()=>c.remove(),3000);}
}

function refreshUI(){
const st=STAGES[si];
document.getElementById('sn').textContent=st.name;
document.getElementById('bt').textContent='💕'+Math.floor(state.bond);
const nxt=si<STAGES.length-1?STAGES[si+1].min:null;
if(!nxt){document.getElementById('gf').style.width='100%';document.getElementById('gl').textContent='다 컴어요! 👑';}
else{const p=Math.max(0,Math.min(100,((state.bond-st.min)/(nxt-st.min))*100));document.getElementById('gf').style.width=p.toFixed(0)+'%';document.getElementById('gl').textContent='다음까지 💕'+Math.max(0,Math.ceil(nxt-state.bond));}
document.getElementById('ff').style.width=state.full+'%';
document.getElementById('hf').style.width=state.happy+'%';
}

let spT=null;
function say(text,dur=2400){const el=document.getElementById('speech');el.textContent=text;el.classList.add('show');clearTimeout(spT);spT=setTimeout(()=>el.classList.remove('show'),dur);}

cv.addEventListener('pointerdown',e=>{gac();if(ac&&ac.state==='suspended')ac.resume();const x=e.clientX,y=e.clientY;if(playMode){moveToy(x,y);return;}if(isOnCat(x,y)){if(sleepOn){wake();say('잘 잤다! 😺');return;}an.eL=1;pet(x,y);}});
cv.addEventListener('pointermove',e=>{const x=e.clientX,y=e.clientY;if(playMode){moveToy(x,y);return;}if((e.pressure>0||e.buttons>0)&&isOnCat(x,y))pet(x,y);});
cv.addEventListener('touchmove',e=>{const t=e.touches[0];if(!t)return;if(playMode)moveToy(t.clientX,t.clientY);else if(isOnCat(t.clientX,t.clientY))pet(t.clientX,t.clientY);e.preventDefault();},{passive:false});

setInterval(()=>{
if(sleepOn||playMode)return;
state.full=Math.max(40,state.full-2);state.happy=Math.max(40,state.happy-2);refreshUI();
if(Math.random()<.35){
if(state.full<55)say('연아야 배고파~ 밥 줘! 🍚');
else if(state.happy<55)say('심심해~ 같이 놀자! 🧶');
else say(pick(LINES.idle));
an.eL=Math.random();an.eR=Math.random();
}
},15000);

refreshUI();
setTimeout(()=>{say(pick(LINES.greet),2800);meow();jump();},600);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
