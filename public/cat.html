<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>내친구 깜냥이 ✨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;user-select:none;touch-action:none;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:10;}
#sr{display:flex;align-items:center;justify-content:center;gap:14px;font-size:23px;font-weight:bold;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.6);}
#cn{color:#ffd24d;}
.meter{height:20px;border-radius:11px;background:rgba(0,0,0,0.32);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.15);}
.mf{height:100%;border-radius:11px;transition:width .4s;}
.ml{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:bold;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.8);white-space:nowrap;}
#mr{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
#speech{position:fixed;top:18%;left:50%;transform:translateX(-50%) scale(.85);background:rgba(255,255,255,.96);border-radius:22px;padding:15px 26px;font-size:26px;font-weight:bold;color:#e0306a;max-width:84vw;text-align:center;white-space:pre-line;line-height:1.4;box-shadow:0 8px 28px rgba(0,0,0,.22);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30;}
#speech.show{opacity:1;transform:translateX(-50%) scale(1);}
#speech::after{content:'';position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);border:13px solid transparent;border-top-color:rgba(255,255,255,.96);border-bottom:0;}
#actions{position:fixed;bottom:0;left:0;right:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(0,0,0,.42);backdrop-filter:blur(12px);z-index:10;}
.btn{border:none;background:rgba(255,255,255,.1);border-radius:16px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .1s,background .1s;border:1px solid rgba(255,255,255,.14);position:relative;}
.btn:active{transform:scale(.9);background:rgba(255,255,255,.22);}
.btn .ico{font-size:32px;line-height:1;}
.btn .lbl{font-size:14px;font-weight:bold;color:rgba(255,255,255,.92);}
.btn .alert{position:absolute;top:4px;right:8px;width:13px;height:13px;border-radius:50%;background:#ff4444;box-shadow:0 0 8px #ff4444;display:none;}
.btn.need .alert{display:block;animation:bl .8s infinite;}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
#celeb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;}
#celeb.active{animation:ca 3s ease-out forwards;}
@keyframes ca{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
#celeb .box{background:rgba(220,50,120,.93);color:#fff;padding:28px 40px;border-radius:28px;font-size:32px;font-weight:bold;text-align:center;line-height:1.5;white-space:pre-line;box-shadow:0 14px 50px rgba(220,50,120,.5);}
.cp{position:fixed;width:13px;height:13px;border-radius:3px;pointer-events:none;z-index:110;animation:cf var(--cd) ease-in forwards;}
@keyframes cf{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(540deg) translateX(var(--cx));opacity:0}}
.tbtn{position:fixed;z-index:60;border:none;border-radius:50%;width:50px;height:50px;font-size:25px;cursor:pointer;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.3);}
#home{top:10px;left:10px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.22);}
#missbtn{top:68px;left:10px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.22);}
#shopbtn{top:10px;right:14px;background:linear-gradient(135deg,#ff6b9d,#ff9d4d);color:#fff;}
#gamebtn{top:68px;right:14px;background:linear-gradient(135deg,#7bc6ff,#5a9bd6);color:#fff;}
.ov{position:fixed;inset:0;background:rgba(10,5,25,.62);display:flex;align-items:center;justify-content:center;z-index:120;padding:16px;}
.ov.hidden{display:none;}
.box2{background:#fff;border-radius:26px;padding:20px 18px;width:min(94vw,440px);max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.t2{font-size:25px;font-weight:bold;color:#e0306a;text-align:center;}
.sub2{text-align:center;font-size:16px;color:#ff9d4d;font-weight:bold;margin:4px 0 12px;}
#shopmsg{text-align:center;font-size:15px;color:#ff5c5c;font-weight:bold;height:20px;margin-bottom:6px;white-space:pre-line;}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.sitem{border:2.5px solid #eee;border-radius:18px;padding:12px 4px 8px;text-align:center;cursor:pointer;background:#fafafa;transition:transform .1s;}
.sitem:active{transform:scale(.93);}
.sitem .se{font-size:40px;line-height:1.1;}
.sitem .sn2{font-size:14px;font-weight:bold;color:#777;margin-top:3px;}
.sitem .sp{font-size:13px;color:#ff9d4d;font-weight:bold;margin-top:1px;}
.sitem.owned{border-color:#8fd178;}
.sitem.equipped{border-color:#ff6b9d;background:#fff0f6;}
.sitem.equipped .sp{color:#ff6b9d;}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#faf7ff;margin-bottom:10px;}
.mrow.done{background:#eafae6;}
.mrow .me{font-size:32px;}
.mrow .mtxt{flex:1;font-size:18px;font-weight:bold;color:#666;}
.mrow.done .mtxt{color:#5fa84f;}
.mrow .mpb{height:13px;border-radius:8px;background:#e8e8e8;overflow:hidden;margin-top:5px;}
.mrow .mpf{height:100%;background:linear-gradient(90deg,#ff9ec7,#ff6b9d);transition:width .3s;}
.mrow .mrew{font-size:14px;color:#ff9d4d;font-weight:bold;white-space:nowrap;}
.closebtn{display:block;margin:16px auto 0;border:none;background:linear-gradient(135deg,#ff6b9d,#ff9d4d);color:#fff;font-size:19px;font-weight:bold;padding:13px 46px;border-radius:40px;cursor:pointer;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div id="sr"><span id="sn">🐾 아기 깜냥이</span><span id="cn">🪙20</span></div>
<div class="meter"><div id="gf" class="mf" style="background:linear-gradient(90deg,#ffd24d,#ff9d4d);width:0%"></div><div class="ml" id="gl">다음까지 💕40</div></div>
<div id="mr">
<div class="meter"><div id="ff" class="mf" style="background:linear-gradient(90deg,#ffb347,#ff8c42);width:80%"></div><div class="ml">🍚 배부름</div></div>
<div class="meter"><div id="hf" class="mf" style="background:linear-gradient(90deg,#ff9ec7,#ff6b9d);width:80%"></div><div class="ml">💛 행복</div></div>
<div class="meter"><div id="clf" class="mf" style="background:linear-gradient(90deg,#7be3ff,#42b0ff);width:90%"></div><div class="ml">🛁 깨끗</div></div>
<div class="meter"><div id="hef" class="mf" style="background:linear-gradient(90deg,#8fe88f,#42c042);width:100%"></div><div class="ml">❤️ 건강</div></div>
</div>
</div>
<div id="speech"></div>
<div id="actions">
<button class="btn" data-act="feed"><span class="ico">🍚</span><span class="lbl">밥주기</span><span class="alert"></span></button>
<button class="btn" data-act="treat"><span class="ico">🐟</span><span class="lbl">간식</span></button>
<button class="btn" data-act="play"><span class="ico">🧶</span><span class="lbl">놀기</span><span class="alert"></span></button>
<button class="btn" data-act="wash"><span class="ico">🛁</span><span class="lbl">목욕</span><span class="alert"></span></button>
<button class="btn" data-act="brush"><span class="ico">✨</span><span class="lbl">빗질</span></button>
<button class="btn" data-act="med"><span class="ico">💊</span><span class="lbl">약</span><span class="alert"></span></button>
<button class="btn" data-act="sleep"><span class="ico">😴</span><span class="lbl">재우기</span></button>
<button class="btn" data-act="game"><span class="ico">🎮</span><span class="lbl">게임</span></button>
</div>
<div id="celeb"><div class="box" id="ct"></div></div>
<a id="home" class="tbtn" href="./play.html">🏠</a>
<button id="missbtn" class="tbtn">📋</button>
<button id="shopbtn" class="tbtn">🛍️</button>
<a id="gamebtn" class="tbtn" href="./fishing.html">🐟</a>
<div id="shop" class="ov hidden">
  <div class="box2">
    <div class="t2">🛍️ 깜냥이 꾸미기</div>
    <div class="sub2" id="shopcoins">🪙 20 코인</div>
    <div id="shopmsg"></div>
    <div class="shopgrid" id="shopgrid"></div>
    <button class="closebtn" id="shopclose">닫기</button>
  </div>
</div>
<div id="miss" class="ov hidden">
  <div class="box2">
    <div class="t2">📋 오늘의 목표</div>
    <div class="sub2" id="agetxt">연아랑 함께 1일째 💖</div>
    <div id="misslist"></div>
    <button class="closebtn" id="missclose">닫기</button>
  </div>
</div>
<script>
(function(){
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,catX;
function resize(){const pr=devicePixelRatio||1;cv.width=window.innerWidth*pr;cv.height=window.innerHeight*pr;cv.style.width=window.innerWidth+'px';cv.style.height=window.innerHeight+'px';cx.setTransform(pr,0,0,pr,0,0);W=window.innerWidth;H=window.innerHeight;if(catX===undefined)catX=W/2;catX=Math.max(70,Math.min(W-70,catX));}
window.addEventListener('resize',resize);resize();

const STAGES=[
{name:'🐾 아기 깜냥이',min:0,sc:0.52},
{name:'🌱 꼬마 깜냥이',min:40,sc:0.68},
{name:'⭐ 청소년 깜냥이',min:120,sc:0.86},
{name:'👑 어른 깜냥이',min:280,sc:1.04},
];
// 진화 분기 (케어 품질로 결정)
const FORMS={
angel:{title:'😇 천사 깜냥이',aura:'rgba(255,230,120,'},
wizard:{title:'🧙 마법사 깜냥이',aura:'rgba(190,150,255,'},
super:{title:'🦸 슈퍼 깜냥이',aura:'rgba(120,200,255,'},
};
const ACC=[
{id:'bow',e:'🎀',name:'리본',price:10,x:-28,y:-52,sz:38},
{id:'flower',e:'🌸',name:'꽃',price:15,x:-30,y:-48,sz:36},
{id:'hat',e:'🎩',name:'모자',price:25,x:0,y:-62,sz:50},
{id:'glasses',e:'🕶️',name:'선글라스',price:30,x:0,y:-8,sz:52},
{id:'scarf',e:'🧣',name:'목도리',price:35,x:0,y:50,sz:48},
{id:'crown',e:'👑',name:'왕관',price:60,x:0,y:-64,sz:52},
];
const ACCMAP={};ACC.forEach(a=>ACCMAP[a.id]=a);

let state={full:80,happy:80,clean:90,health:100,bond:0,coins:20,owned:[],equipped:'',care:50,form:'',firstTs:Date.now()};
try{const s=JSON.parse(localStorage.getItem('kk5')||'null');
  if(s){Object.assign(state,s);}
  else{const o4=JSON.parse(localStorage.getItem('kk4')||'null');if(o4){state.bond=o4.bond||0;state.coins=(o4.coins!=null?o4.coins:20);state.owned=o4.owned||[];state.equipped=o4.equipped||'';}
    else{const o3=JSON.parse(localStorage.getItem('kk3')||'{}');if(o3.bond)state.bond=o3.bond;}}
}catch(e){}
if(!state.firstTs)state.firstTs=Date.now();
if(state.clean==null)state.clean=90;if(state.health==null)state.health=100;if(state.care==null)state.care=50;
function stageOf(b){let i=0;STAGES.forEach((s,idx)=>{if(b>=s.min)i=idx;});return i;}
let si=stageOf(state.bond);
function save(){try{localStorage.setItem('kk5',JSON.stringify(state));}catch(e){}}
function ageDays(){return Math.max(1,Math.floor((Date.now()-state.firstTs)/86400000)+1);}

// Audio
let ac=null;
function gac(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function meow(){try{const c=gac(),o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';f.type='bandpass';f.frequency.value=1100;f.Q.value=6;o.connect(f);f.connect(g);g.connect(c.destination);const t=c.currentTime;o.frequency.setValueAtTime(620,t);o.frequency.linearRampToValueAtTime(900,t+.12);o.frequency.linearRampToValueAtTime(500,t+.34);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.start(t);o.stop(t+.42);}catch(e){}}
function purr(){try{const c=gac(),o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();o.type='sawtooth';o.frequency.value=42;lp.type='lowpass';lp.frequency.value=200;o.connect(lp);lp.connect(g);g.connect(c.destination);const t=c.currentTime;g.gain.setValueAtTime(.12,t);g.gain.setValueAtTime(.12,t+.7);g.gain.exponentialRampToValueAtTime(.001,t+.95);o.start(t);o.stop(t+.96);}catch(e){}}
function chime(ns){try{const c=gac();ns.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.connect(g);g.connect(c.destination);const t=c.currentTime+i*.11;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.33);});}catch(e){}}
function coinSfx(){chime([1047,1568]);}
function clickSfx(){chime([880]);}

// Particles
const pts=[];
class P{
constructor(x,y,o={}){this.x=x;this.y=y;this.vx=(Math.random()-.5)*(o.spd||4);this.vy=-Math.random()*(o.spd||4)-1;this.life=1;this.dec=.018+Math.random()*.02;this.sz=(o.sz||9)+Math.random()*6;this.col=o.col||`hsl(${Math.random()*360},88%,65%)`;this.type=o.type||'circle';this.txt=o.txt||'✨';this.grav=o.grav!==undefined?o.grav:.1;this.rot=Math.random()*Math.PI*2;this.rv=(Math.random()-.5)*.2;}
update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.grav;this.life-=this.dec;this.rot+=this.rv;return this.life>0;}
draw(c){c.save();c.globalAlpha=Math.max(0,this.life);c.translate(this.x,this.y);c.rotate(this.rot);if(this.type==='text'){c.font=`${this.sz}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(this.txt,0,0);}else if(this.type==='rect'){c.fillStyle=this.col;c.fillRect(-this.sz/2,-this.sz/2,this.sz,this.sz);}else{c.beginPath();c.arc(0,0,this.sz/2,0,Math.PI*2);c.fillStyle=this.col;c.fill();}c.restore();}
}
function burst(x,y,n,o){for(let i=0;i<n;i++)pts.push(new P(x,y,o));}
function confettiDom(n){const cols=['#ff6b9d','#ffd24d','#8fd178','#7bc6ff','#c89bff','#ff9d4d'];for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cp';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.setProperty('--cd',(1.5+Math.random()*1.2).toFixed(2)+'s');c.style.setProperty('--cx',((Math.random()-.5)*160).toFixed(0)+'px');c.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3000);}}

const an={br:0,tail:0,eL:0,eR:0,blT:0,blD:0,nxB:0,eo:1,jy:0,jvy:0,jump:false,sx:1,sy:1,mood:'normal',face:1,walking:false};
function jump(){if(an.jump)return;an.jump=true;an.jvy=-.45;an.sx=.85;an.sy=1.2;}

let hopTarget=W/2,nextHop=0;
const bf={active:false,x:0,y:0,vx:0,ph:0};
let nextBf=4000;
const poops=[];
function hopTo(tx){hopTarget=tx;an.face=tx>=catX?1:-1;an.walking=true;jump();}
function spawnBf(){bf.active=true;bf.x=Math.random()<.5?-30:W+30;bf.vx=bf.x<0?(1+Math.random()*.8):-(1+Math.random()*.8);bf.y=H*.40+Math.random()*H*.16;bf.ph=Math.random()*6;}
function catchBf(){bf.active=false;addCoins(5);state.happy=Math.min(100,state.happy+8);say('나비 잡았다! 🦋');meow();burst(catX,H*.72-100*STAGES[si].sc,12,{type:'text',txt:'💕',sz:20,spd:4});trackMission('butterfly');refreshUI();}
function spawnPoop(){if(poops.length>=5||state.sleeping)return;poops.push({x:60+Math.random()*(W-120),y:H*.80+Math.random()*(H*.07)});}

let sick=false;

function drawCat(ox,oy,sc){
cx.save();
cx.translate(ox,oy+an.jy);
// 진화 아우라
if(state.form&&FORMS[state.form]){const au=FORMS[state.form].aura;const pulse=.5+.5*Math.sin(an.br*Math.PI*2);const gr=cx.createRadialGradient(0,20,20,0,20,150);gr.addColorStop(0,au+(0.35*pulse+0.15)+')');gr.addColorStop(1,au+'0)');cx.beginPath();cx.arc(0,20,150,0,Math.PI*2);cx.fillStyle=gr;cx.fill();}
cx.scale(an.face*sc*an.sx,sc*an.sy);
const br=Math.sin(an.br*Math.PI*2)*.012;
cx.beginPath();cx.ellipse(0,148,70*(1+br*2),12,0,0,Math.PI*2);cx.fillStyle='rgba(0,0,0,.18)';cx.fill();
cx.save();cx.translate(52,90);cx.rotate(an.tail);
cx.beginPath();cx.moveTo(0,0);cx.bezierCurveTo(80,-20,90,-80,40,-120);cx.bezierCurveTo(20,-140,-10,-130,0,-110);cx.bezierCurveTo(30,-105,50,-80,20,-40);cx.bezierCurveTo(10,-20,5,-10,0,0);
const tg=cx.createLinearGradient(0,0,40,-120);tg.addColorStop(0,'#2a2a38');tg.addColorStop(1,'#3e3e52');cx.fillStyle=tg;cx.fill();cx.restore();
cx.save();cx.scale(1+br,1-br*.5);
const bg=cx.createRadialGradient(-20,20,10,0,40,90);bg.addColorStop(0,'#4a4a60');bg.addColorStop(1,'#1e1e2e');
cx.beginPath();cx.ellipse(0,60,68,82,0,0,Math.PI*2);cx.fillStyle=bg;cx.fill();
const blg=cx.createRadialGradient(0,80,5,0,80,48);blg.addColorStop(0,'#5a5a72');blg.addColorStop(1,'rgba(60,60,80,0)');
cx.beginPath();cx.ellipse(0,80,38,46,0,0,Math.PI*2);cx.fillStyle=blg;cx.fill();cx.restore();
[[-30,140],[30,140]].forEach(([px,py])=>{
cx.beginPath();cx.ellipse(px,py,20,13,0,0,Math.PI*2);cx.fillStyle='#2a2a38';cx.fill();
cx.strokeStyle='#1a1a28';cx.lineWidth=1.5;
[-6,0,6].forEach(dx=>{cx.beginPath();cx.moveTo(px+dx,py+6);cx.lineTo(px+dx,py+12);cx.stroke();});
});
cx.save();cx.translate(0,-40);
cx.save();cx.translate(-46,-50);cx.rotate(-.15+an.eL*.3);
cx.beginPath();cx.moveTo(0,0);cx.lineTo(-22,-48);cx.lineTo(26,-32);cx.closePath();cx.fillStyle='#2a2a38';cx.fill();
cx.beginPath();cx.moveTo(2,-3);cx.lineTo(-12,-34);cx.lineTo(16,-22);cx.closePath();cx.fillStyle='#f3a0b5';cx.fill();cx.restore();
cx.save();cx.translate(46,-50);cx.rotate(.15-an.eR*.3);
cx.beginPath();cx.moveTo(0,0);cx.lineTo(22,-48);cx.lineTo(-26,-32);cx.closePath();cx.fillStyle='#2a2a38';cx.fill();
cx.beginPath();cx.moveTo(-2,-3);cx.lineTo(12,-34);cx.lineTo(-16,-22);cx.closePath();cx.fillStyle='#f3a0b5';cx.fill();cx.restore();
const hg=cx.createRadialGradient(-15,-20,5,0,0,62);hg.addColorStop(0,'#4a4a60');hg.addColorStop(1,'#1e1e2e');
cx.beginPath();cx.arc(0,0,60,0,Math.PI*2);cx.fillStyle=hg;cx.fill();
cx.globalAlpha=.42;
[[-38,18],[38,18]].forEach(([bx,by])=>{
const gg=cx.createRadialGradient(bx,by,0,bx,by,16);gg.addColorStop(0,'#ff9ec7');gg.addColorStop(1,'transparent');
cx.beginPath();cx.arc(bx,by,16,0,Math.PI*2);cx.fillStyle=gg;cx.fill();
});cx.globalAlpha=1;
const eo=an.eo,mood=an.mood;
[[-22,-8],[22,-8]].forEach(([ex,ey])=>{
if(mood==='sleep'||eo<.15){
cx.beginPath();cx.moveTo(ex-14,ey);cx.quadraticCurveTo(ex,ey+10,ex+14,ey);cx.strokeStyle='#d0c0e8';cx.lineWidth=3.5;cx.lineCap='round';cx.stroke();
}else if(mood==='sick'){

[[.14,.1,55],[.62,.07,40],[.4,.16,48]].forEach(([fx,fy,r])=>{const x=fx*W,y=fy*H;cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.arc(x+r*.8,y-r*.3,r*.75,0,Math.PI*2);cx.arc(x-r*.7,y-r*.22,r*.65,0,Math.PI*2);cx.arc(x+r*1.4,y+r*.1,r*.55,0,Math.PI*2);cx.fill();});

else{fg.addColorStop(0,'rgba(139,200,130,0)');fg.addColorStop(.3,'rgba(139,200,130,.35)');fg.addColorStop(1,'#7dc47a');}

let playMode=false,toyX=W/2,toyY=H*.4,playEnd=0;

function loop(t){
const dt=Math.min(t-lt,50);lt=t;
cx.clearRect(0,0,W,H);
drawBg(t);
an.br+=dt*.00028;
an.tail=.15+Math.sin(t*.0018)*.2;
an.eL+=(-an.eL)*.08;an.eR+=(-an.eR)*.08;
if(t>an.nxB){an.blT=t;an.blD=110;an.nxB=t+2500+Math.random()*3500;}
if(an.blD>0){const bl=(t-an.blT)/an.blD;an.eo=bl<.5?1-bl*2:(bl-.5)*2;if(bl>=1)an.blD=0;}else an.eo=1;
if(an.jump){an.jy+=an.jvy*dt;an.jvy+=.008*dt;if(an.walking)catX+=(hopTarget-catX)*.16;if(an.jy>=0){an.jy=0;an.jump=false;an.jvy=0;an.sx=1.18;an.sy=.82;if(an.walking){catX=hopTarget;an.walking=false;}}}
an.sx+=(1-an.sx)*.14;an.sy+=(1-an.sy)*.14;
const sc=STAGES[si].sc;
if(bf.active){
bf.ph+=.05;bf.x+=bf.vx;const by=bf.y+Math.sin(bf.ph)*28;
cx.save();cx.translate(bf.x,by);cx.rotate(Math.sin(bf.ph*2)*.2);cx.font='34px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🦋',0,0);cx.restore();
if(an.jump&&Math.abs(bf.x-catX)<60*sc)catchBf();
if(bf.x<-60||bf.x>W+60)bf.active=false;
}else if(t>nextBf&&!sleepOn&&!playMode){spawnBf();nextBf=t+11000+Math.random()*8000;}
if(!sleepOn&&!playMode&&an.mood!=='eat'&&!an.jump&&t>nextHop){
if(bf.active){hopTo(Math.max(70,Math.min(W-70,bf.x)));nextHop=t+550;}
else{hopTo(80+Math.random()*(W-160));nextHop=t+3500+Math.random()*4500;}
}
if(playMode){
if(t>playEnd){playMode=false;endPlay();}
cx.font='42px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🧶',toyX,toyY);
const dist=Math.hypot(toyX-catX,toyY-(H*.72-50*sc));
if(dist<100){catX+=(toyX-catX)*.06;an.face=toyX>=catX?1:-1;if(dist<70&&Math.random()<.05){jump();burst(toyX,toyY,2,{type:'text',txt:'✨',sz:18,spd:3});}}
}
drawCat(catX,H*.72-50,sc);
// 아플 표시
if(sick&&!sleepOn){cx.font='30px serif';cx.textAlign='center';cx.fillText('🤒',catX+50*sc,H*.72-150*sc);}
for(let i=pts.length-1;i>=0;i--){if(!pts[i].update()){pts.splice(i,1);continue;}pts[i].draw(cx);}
requestAnimationFrame(loop);
}

function pickMissions(){const pool=POOL.slice(),out=[];while(out.length<3&&pool.length){const i=Math.floor(Math.random()*pool.length);out.push(Object.assign({prog:0,done:false},pool.splice(i,1)[0]));}return out;}
function trackMission(key,n=1){let ch=false;missions.forEach(m=>{if(m.done||m.key!==key)return;m.prog=Math.min(m.goal,m.prog+n);ch=true;if(m.prog>=m.goal){m.done=true;addCoins(m.reward);say('목표 성공! 🎉 🪙+'+m.reward,2400);confettiDom(14);chime([1047,1319,1568]);}});if(missions.every(m=>m.done))setTimeout(()=>{missions=pickMissions();renderMiss();},1600);if(ch&&!document.getElementById('miss').classList.contains('hidden'))renderMiss();}

d.innerHTML=`<div class="me">${m.done?'✅':m.e}</div><div class="mtxt">${m.label} <span style="font-size:14px;color:#aaa">(${m.prog}/${m.goal})</span><div class="mpb"><div class="mpf" style="width:${p}%"></div></div></div><div class="mrew">🪙${m.reward}</div>`;
list.appendChild(d);
});
}

cv.addEventListener('pointerdown',e=>{gac();if(ac&&ac.state==='suspended')ac.resume();const x=e.clientX,y=e.clientY;if(playMode){moveToy(x,y);return;}if(tryCleanPoop(x,y))return;if(isOnCat(x,y)){if(sleepOn){wake();say('잘 잤다! 😺');return;}an.eL=1;pet(x,y);}});
cv.addEventListener('pointermove',e=>{const x=e.clientX,y=e.clientY;if(playMode){moveToy(x,y);return;}if((e.pressure>0||e.buttons>0)&&isOnCat(x,y))pet(x,y);});
cv.addEventListener('touchmove',e=>{const t=e.touches[0];if(!t)return;if(playMode)moveToy(t.clientX,t.clientY);else if(isOnCat(t.clientX,t.clientY))pet(t.clientX,t.clientY);e.preventDefault();},{passive:false});

// 다마고치 케어 루프 (부드럽게)
setInterval(()=>{
if(sleepOn){state.health=Math.min(100,state.health+1);return;}
state.full=Math.max(35,state.full-2);
state.happy=Math.max(35,state.happy-2);
state.clean=Math.max(0,state.clean-3-poops.length*2);
if(Math.random()<.45)spawnPoop();
const neglect=(state.full<35||state.clean<25||poops.length>=4);
if(neglect)state.health=Math.max(20,state.health-4);
else state.health=Math.min(100,state.health+2);
sick=state.health<50;
if(sick&&an.mood!=='eat'&&an.mood!=='happy'&&an.mood!=='play')an.mood='sick';
else if(!sick&&an.mood==='sick')an.mood='normal';
// 케어 점수 (진화 분기용)
if(state.full>60&&state.happy>60&&state.clean>60&&state.health>70)state.care=Math.min(100,state.care+1);
else if(neglect||sick)state.care=Math.max(0,state.care-2);
refreshUI();save();
if(Math.random()<.4){
if(sick)say('연아야... 몸이 아파 💊 약 줄래?',2600);
else if(poops.length>0)say('응가 치워줘~ 💩',2200);
else if(state.full<45)say('연아야 배고파~ 밥 줘! 🍚',2200);
else if(state.happy<45)say('심심해~ 같이 놀자! 🧶',2200);
else say(pick(LINES.idle));
an.eL=Math.random();an.eR=Math.random();
}
},14000);

if(si===STAGES.length-1&&!state.form)evolve();
save();
refreshUI();
setTimeout(()=>{say('연아야 안녕! 함께한 지 '+ageDays()+'일째 💖',3000);meow();jump();},600);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
