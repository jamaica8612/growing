<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>연아의 놀이방 🌈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Nanum Gothic',sans-serif;background:linear-gradient(160deg,#ffd9ec 0%,#fff0d6 45%,#d6f0ff 100%);min-height:100%;overflow-x:hidden;user-select:none;display:flex;flex-direction:column;align-items:center;padding:20px 14px calc(24px + env(safe-area-inset-bottom));}
h1{font-size:32px;color:#e0306a;text-shadow:0 3px 8px rgba(255,107,157,.28);margin-top:10px;text-align:center;}
.sub{font-size:16px;color:#ff8fab;margin:6px 0 20px;text-align:center;}
.menu{width:100%;max-width:420px;display:flex;flex-direction:column;gap:15px;}
.card{display:flex;align-items:center;gap:16px;text-decoration:none;background:#fff;border-radius:24px;padding:20px 22px;box-shadow:0 8px 24px rgba(0,0,0,.1);border:3px solid transparent;transition:transform .12s;}
.card:active{transform:scale(.96);}
.card .em{font-size:54px;line-height:1;}
.card .tx{display:flex;flex-direction:column;gap:3px;}
.card .nm{font-size:23px;font-weight:bold;}
.card .ds{font-size:13px;color:#aaa;}
.card.fish{border-color:#7bc6ff;}.card.fish .nm{color:#2a90d6;}
.card.cat{border-color:#c89bff;}.card.cat .nm{color:#8b55d6;}
.card.bbl{border-color:#ffb3cc;}.card.bbl .nm{color:#e0306a;}
.badge{background:linear-gradient(135deg,#ff6b9d,#ff9d4d);color:#fff;font-size:11px;font-weight:bold;padding:3px 9px;border-radius:20px;margin-left:8px;vertical-align:middle;}
.fl{animation:fl 3.2s ease-in-out infinite;}
@keyframes fl{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.hi{margin-top:26px;font-size:15px;color:#ff8fab;text-align:center;line-height:1.7;}
.deco{position:fixed;pointer-events:none;opacity:.45;font-size:28px;}
</style>
</head>
<body>
<div class="deco" style="top:5%;left:7%">⭐</div>
<div class="deco" style="top:11%;right:9%">🎈</div>
<div class="deco" style="bottom:9%;left:10%">🌸</div>
<div class="deco" style="bottom:13%;right:7%">🌈</div>

<h1>🌈 연아의 놀이방 🌈</h1>
<div class="sub">오늘은 뭐하고 놀까? 골라봐! 💕</div>

<div class="menu">
  <a class="card fish" href="./fishing.html">
    <span class="em fl">🐟</span>
    <span class="tx">
      <span class="nm">물고기 잡기 <span class="badge">NEW</span></span>
      <span class="ds">왼쪽 ← 오른쪽 → 움직여서 물고기를 활활! 🎮</span>
    </span>
  </a>
  <a class="card cat" href="./cat.html">
    <span class="em fl" style="animation-delay:.6s">🐱</span>
    <span class="tx">
      <span class="nm">내친구 깜냥이</span>
      <span class="ds">고양이 밥 주고 놀아주며 키우기 🌱</span>
    </span>
  </a>
  <a class="card bbl" href="./game.html">
    <span class="em fl" style="animation-delay:1.1s">🎈</span>
    <span class="tx">
      <span class="nm">버블 팡팡</span>
      <span class="ds">둥실둥실 버블을 톡톡 터뜨리기 ✨</span>
    </span>
  </a>
</div>

<div class="hi">연아야, 많이 웃고 빨리 나아서<br>집에서도 같이 놀자! 💕</div>
</body>
</html>
