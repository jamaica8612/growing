<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>연아의 놀이방</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#202238;background:#dcefff}
body{overflow-x:hidden;user-select:none}
.hero{min-height:100vh;padding:22px 16px calc(24px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;position:relative;background:linear-gradient(155deg,#c9eeff 0%,#fff0d7 45%,#ffd7e9 100%)}
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sky span{position:absolute;font-size:34px;filter:drop-shadow(0 12px 18px rgba(32,34,56,.12));animation:float 5s ease-in-out infinite}
.sky span:nth-child(1){left:6%;top:8%}.sky span:nth-child(2){right:8%;top:12%;animation-delay:.7s}.sky span:nth-child(3){left:9%;bottom:9%;animation-delay:1.3s}.sky span:nth-child(4){right:7%;bottom:12%;animation-delay:2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
header{position:relative;z-index:1;text-align:center;padding-top:6px}
.eyebrow{margin:0 0 8px;font-size:13px;font-weight:900;color:#ff5c8a;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-size:clamp(34px,8vw,52px);line-height:1.05;font-weight:950;letter-spacing:0;color:#202238;text-shadow:0 6px 18px rgba(255,255,255,.7)}
.sub{margin:12px auto 0;max-width:520px;color:#6b7088;font-weight:800;font-size:16px;line-height:1.55}
.menu{position:relative;z-index:1;align-self:center;width:min(720px,100%);margin:28px auto 0;display:grid;gap:14px}
.card{min-height:112px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;text-decoration:none;color:inherit;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:18px;box-shadow:0 18px 42px rgba(32,34,56,.14);backdrop-filter:blur(16px);position:relative;overflow:hidden}
.card:active{transform:scale(.98)}
.card:before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--accent)}
.icon{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:42px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.42));box-shadow:inset 0 0 0 1px rgba(32,34,56,.07)}
.title{font-size:23px;font-weight:950;letter-spacing:0}
.desc{margin-top:5px;font-size:14px;font-weight:800;color:#6b7088;line-height:1.42}
.badge{display:inline-flex;margin-left:7px;padding:3px 8px;border-radius:999px;background:linear-gradient(135deg,#ff5c8a,#ffb84d);color:white;font-size:11px;font-weight:950;vertical-align:middle}
.go{font-size:28px;color:#969cb0}
footer{position:relative;z-index:1;text-align:center;font-size:13px;font-weight:850;color:#858ba0;line-height:1.5;padding-top:18px}
@media (max-width:520px){
  .card{grid-template-columns:auto 1fr;min-height:104px;border-radius:22px}
  .go{display:none}
  .icon{width:62px;height:62px;font-size:36px;border-radius:20px}
  .title{font-size:20px}
  .desc{font-size:13px}
}
</style>
</head>
<body>
<main class="hero">
  <div class="sky"><span>🐱</span><span>🎈</span><span>🌸</span><span>⭐</span></div>
  <header>
    <p class="eyebrow">Yeona's Playroom</p>
    <h1>연아의 놀이방</h1>
    <p class="sub">태블릿에서 바로 열리는 작은 게임 모음. 깜냥이 키우기부터 짧은 미니게임까지 부담 없이 즐길 수 있어요.</p>
  </header>
  <section class="menu" aria-label="게임 선택">
    <a class="card" href="./cat.html" style="--accent:#8b6cff">
      <span class="icon">🐱</span>
      <span>
        <span class="title">내친구 깜냥이 <span class="badge">MAIN</span></span>
        <span class="desc">성장, 상점, 퀘스트, 훈련이 있는 가상 펫 게임</span>
      </span>
      <span class="go">›</span>
    </a>
    <a class="card" href="./fishing.html" style="--accent:#45b8ff">
      <span class="icon">🐟</span>
      <span>
        <span class="title">깜냥이 물고기 잡기</span>
        <span class="desc">빠르게 움직이며 점수를 올리는 짧은 아케이드 게임</span>
      </span>
      <span class="go">›</span>
    </a>
    <a class="card" href="./game.html" style="--accent:#ff5c8a">
      <span class="icon">🎈</span>
      <span>
        <span class="title">버블 팝</span>
        <span class="desc">동물과 과일 버블을 터뜨리는 가벼운 터치 게임</span>
      </span>
      <span class="go">›</span>
    </a>
  </section>
  <footer>진행 상황은 이 기기의 브라우저에 자동 저장됩니다.</footer>
</main>
</body>
</html>
