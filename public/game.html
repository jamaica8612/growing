<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>연아의 버블 팝 게임 🎈</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: linear-gradient(180deg, #87CEEB 0%, #b8e4f7 40%, #e8f7ff 100%);
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Nanum Gothic', sans-serif;
      user-select: none;
      touch-action: none;
    }

    #score-display {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      border-radius: 50px;
      padding: 14px 32px;
      font-size: 30px;
      font-weight: bold;
      color: #ff6b9d;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(255,107,157,0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    #title {
      position: fixed;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 2px 6px rgba(100,150,200,0.5);
      z-index: 100;
      white-space: nowrap;
      font-weight: 600;
    }

    #message {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 52px;
      font-weight: bold;
      color: #ff6b9d;
      text-shadow: 0 3px 8px rgba(0,0,0,0.15);
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      will-change: transform, top, left;
      box-shadow:
        inset -5px -5px 15px rgba(255,255,255,0.6),
        inset 3px 3px 8px rgba(0,0,0,0.06),
        0 6px 20px rgba(0,0,0,0.12);
    }

    .bubble.popping {
      animation: pop 0.28s ease-out forwards;
    }

    @keyframes pop {
      0%   { transform: scale(1);   opacity: 1; }
      40%  { transform: scale(1.5); opacity: 0.7; }
      100% { transform: scale(0);   opacity: 0; }
    }

    .sparkle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkle-fly 0.55s ease-out forwards;
      z-index: 150;
    }

    @keyframes sparkle-fly {
      0%   { transform: translate(0,0) scale(1.2); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    .score-popup {
      position: fixed;
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
      pointer-events: none;
      z-index: 160;
      animation: score-rise 0.75s ease-out forwards;
      white-space: nowrap;
    }

    @keyframes score-rise {
      0%   { transform: translate(-50%, 0) scale(1);   opacity: 1; }
      100% { transform: translate(-50%, -70px) scale(1.2); opacity: 0; }
    }

    #celebration {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      pointer-events: none;
      opacity: 0;
    }

    #celebration.active {
      animation: celebrate-show 2.2s ease-out forwards;
    }

    @keyframes celebrate-show {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    #celebration-text {
      font-size: 56px;
      font-weight: bold;
      text-align: center;
      line-height: 1.4;
      color: #fff;
      text-shadow: 0 4px 12px rgba(255,107,157,0.6), 0 0 30px rgba(255,200,100,0.5);
      background: rgba(255,107,157,0.2);
      padding: 24px 40px;
      border-radius: 24px;
      backdrop-filter: blur(4px);
    }

    .confetti-piece {
      position: fixed;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      pointer-events: none;
      animation: confetti-fall var(--dur) ease-in forwards;
      z-index: 310;
    }

    @keyframes confetti-fall {
      0%   { transform: translateY(-60px) rotate(0deg)   translateX(0);      opacity: 1; }
      100% { transform: translateY(110vh)  rotate(540deg) translateX(var(--sx)); opacity: 0; }
    }

    .cloud {
      position: fixed;
      background: rgba(255,255,255,0.65);
      border-radius: 50px;
      pointer-events: none;
      animation: cloud-float linear infinite;
    }
    .cloud::before {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.65);
      border-radius: 50%;
    }
    .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.65);
      border-radius: 50%;
    }

    @keyframes cloud-float {
      from { left: -250px; }
      to   { left: calc(100vw + 50px); }
    }
  </style>
</head>
<body>

<div id="score-display">
  <span>⭐</span>
  <span id="score">0</span>
  <span>점</span>
</div>

<div id="title">버블을 터뜨려봐요! 🎈</div>
<div id="message"></div>
<div id="celebration"><div id="celebration-text"></div></div>
<div id="game-area"></div>

<script>
  const gameArea   = document.getElementById('game-area');
  const scoreEl    = document.getElementById('score');
  const messageEl  = document.getElementById('message');
  const celebEl    = document.getElementById('celebration');
  const celebText  = document.getElementById('celebration-text');

  let score   = 0;
  let bubbles = [];
  let nextId  = 0;

  const EMOJIS = [
    '🐱','🐶','🐰','🐸','🦊','🐻','🐼','🐨','🦄','🐙',
    '🦋','🐠','🌸','⭐','🌈','🍭','🎈','🎀','🍓','🌻',
    '🐝','🦜','🦩','🍀','🌺','🍡','🧁','🎠','🌙','🦖',
  ];

  const BUBBLE_COLORS = [
    { bg: 'rgba(255,182,193,0.82)', border: '#ff8fab' },
    { bg: 'rgba(255,218,100,0.82)', border: '#f5a623' },
    { bg: 'rgba(152,251,152,0.82)', border: '#5cb85c' },
    { bg: 'rgba(173,216,230,0.82)', border: '#5ba8d0' },
    { bg: 'rgba(221,160,221,0.82)', border: '#b57bb5' },
    { bg: 'rgba(255,160,100,0.82)', border: '#e06030' },
    { bg: 'rgba(175,238,238,0.82)', border: '#20b2aa' },
    { bg: 'rgba(255,240,130,0.82)', border: '#d4b800' },
  ];

  const PRAISE = [
    '잘했어! 🌟', '최고야! 💕', '브라보! 🎉',
    '연아 짱! ⭐', '대단해! 🎀', '예쁜연아! 🌸',
    '훌륭해! 🦄', '완벽해! 🌈',
  ];

  // ── Audio ──────────────────────────────────────────────
  let audioCtx = null;
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playPop(freq) {
    try {
      const c = ctx(), osc = c.createOscillator(), g = c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.6, c.currentTime + 0.06);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.4, c.currentTime + 0.18);
      g.gain.setValueAtTime(0.28, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.22);
      osc.start(c.currentTime); osc.stop(c.currentTime + 0.22);
    } catch (_) {}
  }

  function playCelebration() {
    try {
      const c = ctx();
      [523,659,784,1047,1319].forEach((f, i) => {
        const osc = c.createOscillator(), g = c.createGain();
        osc.connect(g); g.connect(c.destination);
        const t = c.currentTime + i * 0.13;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.start(t); osc.stop(t + 0.35);
      });
    } catch (_) {}
  }

  // ── VFX ───────────────────────────────────────────────
  function sparkles(x, y) {
    const cols = ['#ff6b9d','#ffd700','#90ee90','#87ceeb','#dda0dd','#ff8c00','#4ecdc4'];
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = (Math.PI * 2 * i) / 12;
      const dist  = 35 + Math.random() * 45;
      const size  = 8 + Math.random() * 10;
      s.style.cssText = `
        left:${x}px; top:${y}px;
        width:${size}px; height:${size}px;
        background:${cols[i % cols.length]};
        --tx:${Math.cos(angle)*dist}px;
        --ty:${Math.sin(angle)*dist}px;
      `;
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 600);
    }
  }

  function scorePopup(x, y) {
    const el = document.createElement('div');
    el.className = 'score-popup';
    el.textContent = '+1 ⭐';
    el.style.cssText = `left:${x}px; top:${y}px;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  function showPraise(text) {
    messageEl.textContent = text;
    messageEl.style.opacity = '1';
    clearTimeout(messageEl._t);
    messageEl._t = setTimeout(() => { messageEl.style.opacity = '0'; }, 1100);
  }

  function celebrate(text) {
    celebText.textContent = text;
    celebEl.classList.remove('active');
    void celebEl.offsetWidth;
    celebEl.classList.add('active');
    playCelebration();

    const cols = ['#ff6b9d','#ffd700','#90ee90','#87ceeb','#dda0dd','#ff6b35','#4ecdc4','#a78bfa'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      const dur = (1.4 + Math.random() * 1.2).toFixed(2) + 's';
      const sx  = ((Math.random() - 0.5) * 160).toFixed(0) + 'px';
      c.style.cssText = `
        left:${Math.random()*100}vw;
        background:${cols[Math.floor(Math.random()*cols.length)]};
        animation-delay:${(Math.random()*0.4).toFixed(2)}s;
        --dur:${dur}; --sx:${sx};
      `;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2800);
    }
  }

  // ── Bubbles ───────────────────────────────────────────
  function spawnBubble(startY) {
    const id    = nextId++;
    const size  = 72 + Math.random() * 64;
    const x     = Math.random() * (window.innerWidth  - size - 10) + 5;
    const y     = (startY !== undefined) ? startY : window.innerHeight + size;
    const speed = 1.0 + Math.random() * 1.4;
    const wobAmp = (Math.random() - 0.5) * 2.2;
    const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    const col   = BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];

    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.cssText = `
      width:${size}px; height:${size}px;
      left:${x}px; top:${y}px;
      background:${col.bg};
      border:3px solid ${col.border};
      font-size:${Math.round(size * 0.52)}px;
    `;
    el.textContent = emoji;
    gameArea.appendChild(el);

    const b = { id, el, x, y, speed, wobAmp, size, popped: false };
    bubbles.push(b);

    function onPop(e) {
      e.preventDefault();
      popBubble(b);
    }
    el.addEventListener('touchstart', onPop, { passive: false });
    el.addEventListener('mousedown',  onPop);
    return b;
  }

  function popBubble(b) {
    if (b.popped) return;
    b.popped = true;

    const rect = b.el.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    b.el.classList.add('popping');
    sparkles(cx, cy);
    scorePopup(cx, cy);
    playPop(380 + Math.random() * 480);

    score++;
    scoreEl.textContent = score;

    if (score % 5 === 0) showPraise(PRAISE[Math.floor(Math.random() * PRAISE.length)]);

    const milestones = {
      10:  '10개! 연아 최고! 🎉\n정말 대단해요! ⭐',
      20:  '20개! 와~ 대박! 🌟\n연아 천재! 💕',
      30:  '30개! 엄청난걸! 🎀\n빨리 나아요! 🌈',
      50:  '50개! 세상에! 🦄\n슈퍼 연아! ✨',
      100: '100개! 전설이다! 🏆\n연아는 최강! 🎊',
    };
    if (milestones[score]) {
      celebrate(milestones[score]);
    } else if (score > 100 && score % 50 === 0) {
      celebrate(`${score}개! 연아 짱짱! 🌟\n멈출 수가 없어! 🎈`);
    }

    setTimeout(() => {
      b.el.remove();
      bubbles = bubbles.filter(x => x.id !== b.id);
    }, 300);
  }

  // ── Game loop ─────────────────────────────────────────
  let lastTs    = 0;
  let spawnAcc  = 0;

  function loop(ts) {
    const dt = Math.min(ts - lastTs, 50);
    lastTs = ts;

    bubbles.forEach(b => {
      if (b.popped) return;
      b.y -= b.speed;
      b.x += Math.sin(b.y * 0.025) * b.wobAmp;
      b.el.style.left = b.x + 'px';
      b.el.style.top  = b.y + 'px';
      if (b.y < -(b.size + 30)) {
        b.el.remove();
        bubbles = bubbles.filter(x => x.id !== b.id);
      }
    });

    spawnAcc += dt;
    const rate = Math.max(700, 1500 - score * 8);
    if (spawnAcc >= rate) {
      spawnAcc = 0;
      const n = score > 25 ? 2 : 1;
      for (let i = 0; i < n; i++) spawnBubble();
    }

    requestAnimationFrame(loop);
  }

  // ── Clouds ────────────────────────────────────────────
  function addClouds() {
    [[120,45,12,'8%',28],
     [90, 30,18,'22%',38],
     [150,50, 8,'5%',22]].forEach(([w,h,br,top,dur]) => {
      const c = document.createElement('div');
      c.className = 'cloud';
      c.style.cssText = `
        width:${w}px; height:${h}px; top:${top};
        border-radius:${br}px;
        animation-duration:${dur}s;
        animation-delay:${(-Math.random()*dur).toFixed(1)}s;
      `;
      // bumps
      c.style.setProperty('--bw', Math.round(w*0.55)+'px');
      document.body.appendChild(c);
    });
  }
  addClouds();

  // ── Init ──────────────────────────────────────────────
  for (let i = 0; i < 6; i++) {
    const b = spawnBubble();
    b.y = 80 + Math.random() * (window.innerHeight - 160);
    b.el.style.top = b.y + 'px';
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
