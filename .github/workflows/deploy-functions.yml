name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy kakao-skill
        run: supabase functions deploy kakao-skill --project-ref xrrdokcjhjqdfvwtbenl --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy kakao-channel-event
        run: supabase functions deploy kakao-channel-event --project-ref xrrdokcjhjqdfvwtbenl --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy assistant
        run: supabase functions deploy assistant --project-ref xrrdokcjhjqdfvwtbenl
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
